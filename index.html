<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BriqSite</title>
<!-- This file's own name never changes, so it's the one page that could
     still get stuck in a stale cache — kept deliberately tiny (just a
     redirect, no game logic) so there's nothing meaningful to lose even
     if a browser does hang onto an old copy of it for a while. Same
     best-effort cache-busting meta tags as the main game file. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- CURRENT_VERSION is the single line to update whenever a new
     briqsite-vX.XX.html is published — everything below reads from it,
     so there's only ever one place to change. -->
<script>
  var CURRENT_VERSION = '1.05';
  var TARGET = 'briqsite-v' + CURRENT_VERSION + '.html?v=' + CURRENT_VERSION;
  // The query string (?v=1.05) is the actual cache-busting mechanism —
  // combined with the version already being IN the filename, a browser
  // (or any CDN in front of it) sees this as a completely unseen URL
  // every single time the version changes, with no stale-cache path at
  // all. location.replace (not .href) skips adding this redirect page
  // itself to browser history, so the Back button goes to wherever the
  // player came from, not bouncing back to this page.
  location.replace(TARGET);
</script>
<!-- No-JS fallback: an ordinary meta refresh, plus a visible link in
     case even that's somehow blocked. -->
<meta http-equiv="refresh" content="0; url=briqsite-v1.05.html?v=1.05">
</head>
<body style="background:#0d0a06; color:#f3e8d2; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Loading BriqSite… if nothing happens, <a href="briqsite-v1.05.html?v=1.05" style="color:#e7b781;">click here</a>.</p>
</body>
</html>
